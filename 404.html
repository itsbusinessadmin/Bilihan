  <script>
    (function () {
      var local = ['localhost', '127.0.0.1', ''];
      if (location.protocol === 'http:' && local.indexOf(location.hostname) === -1) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

  <title>Page Not Found — Bilihan</title>

  <link rel="icon" href="favicon.ico" sizes="32x32" />

    <div class="contact-actions error-actions">
      <a class="primary-btn" href="/#menu">Browse the menu</a>
      <a class="secondary-btn" href="/">Go to the homepage</a>
      <a class="secondary-btn" href="/#contact">Contact us</a>

  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <span>&copy; <span id="year">2026</span> <span data-store-name>Bilihan</span>. All rights reserved.</span>
      <nav class="footer-nav footer-nav-inline" aria-label="Legal">
        <a href="/">Home</a>
        <a href="/privacy.html">Privacy Policy</a>
