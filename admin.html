<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!--
    viewport-fit=cover helps the Admin UI properly use the screen
    on modern iPhones and other devices with safe areas.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#173d24">

  <title>Bilihan Admin</title>

  <!-- YOUR ORIGINAL GLOBAL CSS -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* =========================================================
       BILIHAN ADMIN
       RESPONSIVE WEB-APP LAYOUT
       ========================================================= */

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    img {
      max-width: 100%;
    }


    /* =========================================================
       MAIN ADMIN SHELL
       ========================================================= */

    .admin-shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar {
      width: 240px;
      height: 100vh;
      height: 100dvh;

      position: sticky;
      top: 0;

      display: flex;
      flex-direction: column;

      padding: 22px 14px;

      border-right: 1px solid var(--line);
      background: var(--card);

      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 11px;

      min-height: 58px;
      padding: 2px 5px 14px;
    }

    .admin-brand img {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;

      border-radius: 50%;
      object-fit: cover;

      border: 1px solid var(--line);
      background: var(--bg);
    }

    .admin-brand strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
    }

    .admin-brand small {
      display: block;
      margin-top: 3px;

      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
    }


    /* =========================================================
       SIDEBAR NAVIGATION
       ========================================================= */

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;

      margin-top: 18px;
    }

    .side-nav button {
      width: 100%;
      min-height: 46px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 12px;

      border: 0;
      border-radius: 13px;

      background: transparent;
      color: var(--text);

      text-align: left;
      cursor: pointer;

      transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
    }

    .side-nav button:hover {
      background: var(--bg);
    }

    .side-nav button.active {
      background: var(--accent-2);
      color: var(--card);
      font-weight: 800;
    }


    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    .admin-main {
      min-width: 0;
      width: 100%;

      padding: clamp(22px, 3vw, 38px);

      overflow-x: hidden;
    }

    .admin-main > h1 {
      margin-top: 0;
    }


    /* =========================================================
       DASHBOARD CARDS
       ========================================================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .metric,
    .panel {
      min-width: 0;

      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;

      padding: 18px;
    }

    .metric {
      overflow: hidden;
    }

    .metric h2,
    .metric h3 {
      overflow-wrap: anywhere;
    }

    .panel {
      margin-top: 18px;
    }


    /* =========================================================
       ADMIN TWO-COLUMN CONTENT
       ========================================================= */

    .admin-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.2fr)
        minmax(300px, .8fr);

      gap: 18px;

      align-items: start;
    }


    /* =========================================================
       TABLES
       ========================================================= */

    .table-wrap {
      width: 100%;
      max-width: 100%;

      overflow-x: auto;
      overflow-y: visible;

      -webkit-overflow-scrolling: touch;
    }

    .table {
      width: 100%;
      min-width: 720px;

      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 12px;

      border-bottom: 1px solid var(--line);

      text-align: left;
      vertical-align: middle;
    }

    .table th {
      color: var(--muted);

      font-size: 12px;
      font-weight: 800;

      white-space: nowrap;
    }

    .table td {
      overflow-wrap: anywhere;
    }

    .thumb {
      width: 54px;
      height: 54px;

      flex: 0 0 54px;

      border-radius: 12px;
      object-fit: cover;

      background: var(--bg);
    }


    /* =========================================================
       ROW ACTIONS
       ========================================================= */

    .row-actions {
      display: flex;
      align-items: center;
      gap: 7px;

      flex-wrap: wrap;
    }

    .row-actions button {
      min-height: 38px;

      padding: 7px 10px;

      border: 1px solid var(--line);
      border-radius: 10px;

      background: var(--bg);
      color: var(--text);

      cursor: pointer;
    }

    .row-actions button:hover {
      background: var(--card);
    }


    /* =========================================================
       ADMIN FORMS
       ========================================================= */

    .admin-form {
      display: grid;
      gap: 14px;
    }

    .admin-form label {
      display: grid;
      gap: 7px;

      min-width: 0;

      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .admin-form input,
    .admin-form textarea,
    .admin-form select {
      width: 100%;
      min-width: 0;
      min-height: 46px;

      padding: 11px 13px;

      border: 1px solid var(--line);
      border-radius: 12px;

      outline: none;

      background: var(--bg);
      color: var(--text);
    }

    .admin-form textarea {
      min-height: 110px;

      line-height: 1.5;
      resize: vertical;
    }

    .admin-form input:focus,
    .admin-form textarea:focus,
    .admin-form select:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px rgba(202, 166, 107, .16);
    }

    .admin-form input[type="file"] {
      padding: 9px;
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .admin-main button {
      max-width: 100%;
    }

    .admin-form button[type="submit"],
    .admin-form > button {
      min-height: 46px;
    }


    /* =========================================================
       LOGIN SCREEN
       ========================================================= */

    .login-wrap {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

      background: var(--bg);
    }

    .login-card {
      width: min(420px, 100%);

      padding: clamp(22px, 5vw, 30px);

      background: var(--card);

      border: 1px solid var(--line);
      border-radius: 24px;

      box-shadow: var(--shadow);
    }

    .login-card input {
      width: 100%;
    }


    /* =========================================================
       LARGE DESKTOP
       ========================================================= */

    @media (min-width: 1500px) {

      .admin-shell {
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .sidebar {
        width: 260px;
        padding-left: 18px;
        padding-right: 18px;
      }

      .admin-main {
        max-width: 1600px;
        padding: 42px;
      }

      .cards {
        gap: 18px;
      }

    }


    /* =========================================================
       LAPTOP / SMALL DESKTOP
       ========================================================= */

    @media (max-width: 1200px) {

      .admin-shell {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .sidebar {
        width: 220px;
      }

      .cards {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .admin-grid {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(280px, .75fr);
      }

      .admin-main {
        padding: 26px;
      }

    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 900px) {

      .admin-shell {
        display: block;
        min-height: 100dvh;
      }

      .sidebar {
        width: 100%;
        height: auto;

        position: sticky;
        top: 0;
        z-index: 50;

        padding:
          max(10px, env(safe-area-inset-top))
          14px
          10px;

        border-right: 0;
        border-bottom: 1px solid var(--line);

        box-shadow:
          0 8px 24px rgba(32, 61, 39, .06);
      }

      .admin-brand {
        min-height: 48px;
        padding-bottom: 8px;
      }

      .admin-brand img {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .side-nav {
        display: flex;
        flex-direction: row;

        gap: 6px;

        width: 100%;

        margin-top: 4px;
        padding-bottom: 2px;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;
      }

      .side-nav::-webkit-scrollbar {
        display: none;
      }

      .side-nav button {
        width: auto;
        min-width: max-content;
        min-height: 42px;

        flex: 0 0 auto;

        padding: 9px 12px;

        white-space: nowrap;
      }

      .admin-main {
        padding:
          20px
          16px
          calc(28px + env(safe-area-inset-bottom));
      }

      .admin-grid {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .panel {
        border-radius: 18px;
      }

    }


    /* =========================================================
       PHONE
       ========================================================= */

    @media (max-width: 600px) {

      .sidebar {
        padding-left: 10px;
        padding-right: 10px;
      }

      .admin-brand {
        padding-left: 4px;
      }

      .admin-brand img {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .admin-brand strong {
        font-size: 14px;
      }

      .admin-brand small {
        font-size: 10px;
      }

      .side-nav button {
        min-height: 40px;
        padding: 8px 11px;

        border-radius: 11px;

        font-size: 13px;
      }

      .admin-main {
        padding:
          16px
          12px
          calc(24px + env(safe-area-inset-bottom));
      }

      .cards {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 10px;
      }

      .metric {
        padding: 14px;
        border-radius: 16px;
      }

      .metric h2 {
        font-size: 24px;
      }

      .panel {
        margin-top: 12px;

        padding: 14px;

        border-radius: 16px;
      }

      .admin-grid {
        gap: 12px;
      }

      .admin-form {
        gap: 12px;
      }

      .admin-form input,
      .admin-form textarea,
      .admin-form select {
        min-height: 48px;

        font-size: 16px;
      }

      /*
        16px inputs prevent Safari on iPhone
        from automatically zooming into form fields.
      */

      .row-actions {
        gap: 6px;
      }

      .row-actions button {
        min-height: 42px;
      }

      .table {
        min-width: 650px;
      }

      .thumb {
        width: 48px;
        height: 48px;
      }

    }


    /* =========================================================
       VERY SMALL PHONES
       ========================================================= */

    @media (max-width: 390px) {

      .admin-main {
        padding-left: 9px;
        padding-right: 9px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .metric {
        padding: 13px;
      }

      .panel {
        padding: 12px;
      }

      .side-nav button {
        font-size: 12px;
      }

    }


    /* =========================================================
       LANDSCAPE PHONE
       ========================================================= */

    @media
      (max-height: 500px)
      and (orientation: landscape)
      and (max-width: 900px) {

      .sidebar {
        position: relative;
      }

      .admin-brand {
        display: none;
      }

      .side-nav {
        margin-top: 0;
      }

      .admin-main {
        padding-top: 14px;
      }

    }


    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }

    }
  </style>
</head>

<body>

  <div id="app"></div>


  <!-- =======================================================
       SUPABASE
       Keep your existing connection exactly as before.
       ======================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="admin.js"></script>

</body>
</html>
