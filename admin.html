<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bilihan Admin</title><link rel="stylesheet" href="styles.css"><style>
.admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{padding:24px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh}.admin-brand{display:flex;align-items:center;gap:10px}.admin-brand img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fbf7ee}.side-nav{display:grid;gap:8px;margin-top:28px}.side-nav button{border:0;background:transparent;color:var(--text);text-align:left;padding:12px;border-radius:12px;cursor:pointer}.side-nav button.active{background:var(--bg);font-weight:800}.admin-main{padding:32px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.panel{margin-top:18px}.admin-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover}.row-actions{display:flex;gap:8px;flex-wrap:wrap}.row-actions button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:7px 10px;border-radius:10px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px}.admin-form{display:grid;gap:12px}.admin-form input,.admin-form textarea,.admin-form select{padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}@media(max-width:900px){.admin-shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side-nav{display:flex;overflow:auto}.side-nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.admin-main{padding:18px}.table-wrap{overflow:auto}}
</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="admin.js"></script></body></html>
