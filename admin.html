<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <!--
    Makes the Admin page properly adapt to phones,
    tablets, laptops, and desktop screens.
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- Admin is a private tool: keep it out of search engines entirely. -->
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Force HTTPS. GitHub Pages "Enforce HTTPS" handles this at the edge; belt-and-braces fallback. -->
  <script>
    (function () {
      var local = ['localhost', '127.0.0.1', ''];
      if (location.protocol === 'http:' && local.indexOf(location.hostname) === -1) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Mobile browser/theme color -->
  <meta name="theme-color" content="#1f4d34">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Bilihan Admin</title>

  <!-- =====================================================
       YOUR ORIGINAL BILIHAN CSS
       DO NOT REMOVE
       ===================================================== -->
  <link rel="stylesheet" href="styles.css">

  <!-- =====================================================
       RESPONSIVE ADMIN APP CSS
       IMPORTANT:
       This must stay AFTER styles.css
       ===================================================== -->
  <link rel="stylesheet" href="admin-app.css">

</head>


<body>

  <!-- =====================================================
       BILIHAN ADMIN APP
       admin.js will automatically render everything here.
       ===================================================== -->
  <div id="app"></div>


  <!-- =====================================================
       SUPABASE JAVASCRIPT
       KEEP THIS ORDER
       ===================================================== -->

  <!-- Supabase browser library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase URL + public key -->
  <script src="config.js"></script>

  <!-- Creates the Bilihan Supabase client -->
  <script src="supabase.js"></script>

  <!--
    YOUR WORKING ORIGINAL ADMIN.JS
    DO NOT CHANGE IT
  -->
  <script src="admin.js"></script>

  <!-- UI-only productivity layer. Existing admin.js and Supabase logic stay untouched. -->
  <script src="fast-entry.js"></script>

</body>

</html>
