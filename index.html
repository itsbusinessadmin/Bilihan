<!doctype html>
<html lang="en">
<head>

  <!-- Force HTTPS. GitHub Pages "Enforce HTTPS" handles this at the edge; this is the fallback. -->
  <script>
    (function () {
      var local = ['localhost', '127.0.0.1', ''];
      if (location.protocol === 'http:' && local.indexOf(location.hostname) === -1) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

  <title>Bilihan — Order Food Online for Pickup or Delivery</title>

  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <meta name="theme-color" content="#faf8f3" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Bilihan" />

  <link rel="preconnect" href="https://nrwiblxfqfovmnoofiii.supabase.co" crossorigin />

  <link rel="stylesheet" href="styles.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "Bilihan",
    "slogan": "All food. All good.",
    "description": "Online food store for everyday favorites, meals and snacks, ready for pickup or delivery.",
    "url": "https://bilihan.shop/",
    "logo": "https://bilihan.shop/icon-512.png",
    "image": "https://bilihan.shop/og-image.jpg",
    "areaServed": "PH",
    "currenciesAccepted": "PHP",
    "paymentAccepted": "Cash, QR Payment"
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#menu">Skip to products</a>
  <header class="site-header">
    <a class="brand brand-lockup" href="#home" aria-label="Bilihan Home"><img src="bilihan-mark.webp" width="40" height="40" data-store-logo alt="Bilihan logo"><span id="brandName">Bilihan</span></a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="#home">Home</a><a href="#menu">Products</a><a href="#about">About</a>
      <button id="myOrderBtn" class="nav-link hidden" type="button">My Order</button>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme"><img id="themeIcon" class="ui-icon" src="ios-icons/dark-mode.png" width="22" height="22" alt="" aria-hidden="true"></button>
      <button id="cartBtn" class="cart-btn" type="button" aria-label="Open cart"><img class="ui-icon" src="ios-icons/cart.png" width="22" height="22" alt="" aria-hidden="true"> <span id="cartCount">0</span></button>
      <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav"><span class="menu-bars" aria-hidden="true"></span></button>
    </div>
  </header>
  <nav id="mobileNav" class="mobile-nav" aria-label="Mobile" hidden>
    <a href="#home">Home</a>
    <a href="#menu">Products</a>
    <a href="#about">About</a>
    <button id="myOrderBtnMobile" class="hidden" type="button">My Order</button>
    <div id="mobileNavContact" class="mobile-nav-contact"></div>
  </nav>
  <main>
    <section id="home" class="hero section-pad">
      <div class="hero-copy">
        <span class="eyebrow">All food. All good.</span>
        <h1 id="heroTitle">Good food, made easy.</h1>
        <p id="heroTagline">From everyday favorites to satisfying cravings, find something good at Bilihan.</p>
        <a class="primary-btn" href="#menu">Shop Now</a>
      </div>
      <div class="hero-carousel" aria-label="Featured food">
        <img id="heroImage" src="bilihan-logo.png" width="800" height="600" fetchpriority="high" alt="Featured food from Bilihan" />
        <div id="heroDots" class="hero-dots"></div>
      </div>
    </section>
    <section id="menu" class="section-pad">
      <div class="section-heading"><h2>Pick your favorites</h2></div>
      <div id="connectionBanner" class="status-banner hidden" role="status" aria-live="polite"></div>
      <div class="menu-controls">
        <div id="categoryTabs" class="tabs" role="tablist"></div>
        <div class="view-switch" role="group" aria-label="Product view">
          <button id="gridViewBtn" class="view-btn active" type="button" aria-label="Grid view" aria-pressed="true"><img src="ios-icons/grid.png" width="20" height="20" alt="" aria-hidden="true"></button>
          <button id="listViewBtn" class="view-btn" type="button" aria-label="List view" aria-pressed="false"><img src="ios-icons/list.png" width="20" height="20" alt="" aria-hidden="true"></button>
        </div>
      </div>
      <div id="menuGrid" class="product-grid" aria-live="polite"></div>
    </section>
    <section id="about" class="section-pad split-section">
      <img id="aboutImage" class="about-image" src="bilihan-logo.png" width="700" height="525" loading="lazy" alt="A selection of the food available at Bilihan" />
      <div><h2>Your easy online food stop</h2><p id="aboutText"></p></div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-brand"><img src="bilihan-mark.webp" width="32" height="32" data-store-logo alt=""><strong id="footerBrand">Bilihan</strong></div>
    <nav class="footer-links" aria-label="Footer"><a href="#menu">Products</a><a href="#about">About</a></nav>
    <div id="footerContact" class="footer-contact"></div>
    <span>&copy; <span id="year">2026</span> <span class="footer-copy-name">Bilihan</span></span>
  </footer>
  <aside id="cartDrawer" class="drawer" aria-hidden="true" aria-label="Shopping cart">
    <div class="drawer-header"><h2>Your Cart</h2><button id="closeCart" class="icon-btn" type="button" aria-label="Close cart"><img class="ui-icon" src="ios-icons/close.png" width="20" height="20" alt="" aria-hidden="true"></button></div>
    <div id="cartItems" class="drawer-content"></div>
    <div id="cartFooter" class="drawer-footer"></div>
  </aside>
  <div id="backdrop" class="backdrop hidden"></div>
  <dialog id="productDialog" class="modal"></dialog>
  <dialog id="checkoutDialog" class="modal wide-modal"></dialog>
  <dialog id="orderDialog" class="modal wide-modal"></dialog>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="analytics.js"></script>
  <script src="app.js"></script>
  <script src="support.js" defer></script>
</body>
</html>
