<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bilihan</title>
  <meta name="description" content="Bilihan online food store" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand brand-lockup" href="#home" aria-label="Bilihan Home"><img src="bilihan-logo.png" alt="Bilihan logo"><span id="brandName">Bilihan</span></a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="#home">Home</a><a href="#menu">Products</a>
      <button id="myOrderBtn" class="nav-link hidden">My Order</button>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme"><img id="themeIcon" class="ui-icon" src="ios-icons/dark-mode.png" alt="" aria-hidden="true"></button>
      <button id="cartBtn" class="cart-btn" aria-label="Open cart"><img class="ui-icon" src="ios-icons/cart.png" alt="" aria-hidden="true"> <span id="cartCount">0</span></button>
    </div>
  </header>
  <main>
    <section id="home" class="hero section-pad">
      <div class="hero-copy">
        <span class="eyebrow">All food. All good.</span>
        <h1 id="heroTitle">Good food, made easy.</h1>
        <p id="heroTagline">From everyday favorites to satisfying cravings, find something good at Bilihan.</p>
        <a class="primary-btn" href="#menu">Shop Now</a>
      </div>
      <div class="hero-carousel" aria-label="Featured food">
        <img id="heroImage" alt="Featured food" />
        <div id="heroDots" class="hero-dots"></div>
      </div>
    </section>
    <section id="menu" class="section-pad">
      <div class="section-heading"><span class="eyebrow">Our Menu</span><h2>Pick your favorites</h2></div>
      <div id="connectionBanner" class="status-banner hidden"></div>
      <div class="menu-controls">
        <div id="categoryTabs" class="tabs" role="tablist"></div>
        <div class="view-switch" role="group" aria-label="Product view">
          <button id="gridViewBtn" class="view-btn active" type="button" aria-label="Grid view" aria-pressed="true"><img src="ios-icons/grid.png" alt="" aria-hidden="true"></button>
          <button id="listViewBtn" class="view-btn" type="button" aria-label="List view" aria-pressed="false"><img src="ios-icons/list.png" alt="" aria-hidden="true"></button>
        </div>
      </div>
      <div id="menuGrid" class="product-grid" aria-live="polite"></div>
    </section>
    <section id="about" class="section-pad split-section">
      <img id="aboutImage" class="about-image" alt="Bilihan food selection" />
      <div><span class="eyebrow">About Us</span><h2>Your easy online food stop</h2><p id="aboutText"></p></div>
    </section>
  </main>
  <footer class="footer"><div class="footer-brand"><img src="bilihan-logo.png" alt=""><strong id="footerBrand">Bilihan</strong></div><span id="footerPhone"></span><span>© <span id="year"></span> Bilihan</span></footer>
  <aside id="cartDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-header"><h2>Your Cart</h2><button id="closeCart" class="icon-btn" aria-label="Close cart"><img class="ui-icon" src="ios-icons/close.png" alt="" aria-hidden="true"></button></div>
    <div id="cartItems" class="drawer-content"></div>
    <div id="cartFooter" class="drawer-footer"></div>
  </aside>
  <div id="backdrop" class="backdrop hidden"></div>
  <dialog id="productDialog" class="modal"></dialog>
  <dialog id="checkoutDialog" class="modal wide-modal"></dialog>
  <dialog id="orderDialog" class="modal wide-modal"></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
